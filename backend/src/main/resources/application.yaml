spring:
  application:
    name: backend
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./backend/.env[.properties]"
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME:lms_g6}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  sepay:
    bank: ${SEPAY_BANK:}
    account-number: ${SEPAY_ACCOUNT_NUMBER:}
    account-name: ${SEPAY_ACCOUNT_NAME:}
    webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:}
    qr-base-url: ${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}
    transfer-prefix: ${SEPAY_TRANSFER_PREFIX:}
    sub-account: ${SEPAY_SUB_ACCOUNT:}
